# mise global config - tracked here, symlinked to ~/.config/mise/config.toml (see [dotfiles]).
#
# Dotfile sources use absolute ~/.dotfiles/... paths, not relative ones: relative sources
# resolve against the literal path mise was invoked with, which breaks once this file is
# reached via the ~/.config/mise/config.toml symlink.
#
# For a machine-only tool that shouldn't show up as a repo diff, add it to
# ~/.config/mise/config.local.toml instead of here - it's a sibling of the resolved
# global config path, auto-merged on top, and lives outside the repo entirely so it's
# untracked by construction. Add a tool with:
#   mise use -p ~/.config/mise/config.local.toml <tool>
# (`mise use -g --env local <tool>` does NOT target this file - it writes a
# cwd-relative project mise.local.toml instead, which is a different mechanism.)

[tools]
fzf = "latest"
lazygit = "latest"
neovim = "stable"
starship = "latest"
tmux = "latest"
ripgrep = "latest"
uv = "latest"

[bootstrap.repos]
"~/.config/oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }

# oh-my-tmux is NOT a [bootstrap.repos] entry: we force-symlink tmux.conf.local
# into that clone's working tree below, which permanently makes the clone look
# "dirty" to git - and mise's repos step refuses to converge a dirty target.
# Cloning it here instead keeps the step idempotent (skips once .git exists).
[bootstrap.hooks.pre-dotfiles]
run = [
  "git -C ~/.dotfiles submodule update --init --recursive",
  "[ -d ~/.config/tmux/.git ] || git clone https://github.com/gpakosz/.tmux.git ~/.config/tmux",
  "ln -sf ~/.config/tmux/.tmux.conf ~/.config/tmux/tmux.conf",
]

[bootstrap.user]
login_shell = "/usr/bin/zsh"

[dotfiles]
"~/.config/mise/config.toml" = "~/.dotfiles/mise.toml"
"~/.zshrc" = "~/.dotfiles/zsh/zshrc"
"~/.config/zsh" = "~/.dotfiles/zsh"
"~/.config/bat" = "~/.dotfiles/bat"
"~/.config/alacritty" = "~/.dotfiles/alacritty"
"~/.config/starship.toml" = "~/.dotfiles/starship/starship.toml"
"~/.config/tig/config" = "~/.dotfiles/tig/config"
"~/.config/git" = "~/.dotfiles/git"
"~/.config/ulauncher" = "~/.dotfiles/ulauncher"
"~/.config/zathura" = "~/.dotfiles/zathura"
"~/.config/tmux/tmux.conf.local" = "~/.dotfiles/tmux/tmux.conf.local"
